packages:
  - apps/*
  - packages/*
  - components/*

# Fail closed when a dependency introduces an unreviewed lifecycle/build script.
strictDepBuilds: true

# pnpm 11.24.0 build-script policy. Keep approvals version-pinned so dependency
# upgrades must be reviewed explicitly before their install scripts can run.
allowBuilds:
  bigint-buffer@1.1.5: true
  browser-tabs-lock@1.3.0: true
  bufferutil@4.1.0: true
  core-js@3.47.0: true
  esbuild@0.28.1: true
  esbuild@0.28.2: true
  text-encoding@0.7.0: true
  uuid@8.3.2: true
  msgpackr-extract@3.0.4: true
  utf-8-validate@6.0.6: true
  workerd@1.20260704.1: true
  workerd@1.20260826.1: true
